name: Tag and release plugins

on:
  push:
    branches: [main]
    # Gate: only run when a plugin manifest actually changed. The in-script
    # version diff below is still the real check (paths filters can behave
    # oddly on some merge shapes) — this is purely to skip the job's own
    # checkout/run cost on unrelated pushes (docs, skills, etc).
    paths:
      - "plugins/*/.claude-plugin/plugin.json"
  # Manual recovery/retry path: run against the current version of each
  # plugin regardless of whether it changed in the last push, e.g. to create
  # a release for a tag a prior run pushed but never released.
  workflow_dispatch: {}

# Serialize runs instead of letting them overlap: an overlapping run could
# push its tag before an earlier-triggered run finishes, so the earlier run's
# "previous tag" lookup would pick up the later run's tag instead of the true
# prior one. Queue (never cancel) so no version bump gets dropped.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Needed to push the per-plugin tag and create its GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          # Required so the git push below can authenticate with the
          # checked-out repo's credential (the default; set explicitly so
          # it can't be quietly turned off in a future edit).
          persist-credentials: true

      # Discover plugins from plugins/*/.claude-plugin/plugin.json instead of
      # a fixed list, so a newly added plugin is picked up automatically. On
      # a push: compare each found plugin's "version" between the commit
      # before this push and the commit after it, and skip a plugin whose
      # version did not change. On a manual (workflow_dispatch) run, skip
      # that diff and process every plugin's current version unconditionally
      # — the tag/release existence checks below are what keep that safe (a
      # no-op when both already exist). Either way: create a tag
      # "<plugin>-v<version>" (if it doesn't already exist), then create a
      # GitHub Release for that tag (if one doesn't already exist) with an
      # auto-generated title and notes.
      - name: Tag and release plugins whose version changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # First push of a new branch/history: nothing to diff against.
          if [[ "$EVENT_NAME" == "push" && "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit to diff against, skipping."
            exit 0
          fi

          manifests=(plugins/*/.claude-plugin/plugin.json)
          failed=0

          for manifest in "${manifests[@]}"; do
            plugin_dir="${manifest%/.claude-plugin/plugin.json}"
            plugin="${plugin_dir#plugins/}"

            # No suppression here: the checkout is already at $AFTER, so a
            # missing/invalid manifest here is a real problem, not a
            # "plugin didn't exist yet" case (that's the $BEFORE lookup
            # below) — fail loudly instead of silently skipping it.
            if ! new_version=$(jq -r '.version // empty' "$manifest"); then
              echo "$plugin: failed to parse $manifest (invalid JSON), failing." >&2
              exit 1
            fi

            if [[ -z "$new_version" ]]; then
              echo "$plugin: no version field in $manifest, skipping."
              continue
            fi

            if [[ "$EVENT_NAME" == "push" ]]; then
              old_version=$(git show "$BEFORE:$manifest" 2>/dev/null | jq -r '.version // empty' || true)
              if [[ "$old_version" == "$new_version" ]]; then
                echo "$plugin: no version change, skipping."
                continue
              fi
            fi

            # A version straight from plugin.json could contain anything;
            # only accept characters that make a legal git tag/ref component,
            # so one plugin's bad value can't kill the whole run partway
            # through the loop (git tag would otherwise fail and, under
            # set -e, abort before later plugins are processed).
            if [[ ! "$new_version" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "$plugin: version \"$new_version\" is not a valid tag name, skipping." >&2
              failed=1
              continue
            fi

            tag="${plugin}-v${new_version}"

            # Tag the commit if it isn't already tagged. Idempotent: a
            # retriggered/re-run workflow won't fail or duplicate the tag.
            # --exit-code returns 2 for "no matching tag" specifically; any
            # other failure (network, API) is a real error, not "not found",
            # so it must not be treated as "go ahead and create the tag."
            # Every failure from here on `continue`s instead of `exit`ing,
            # so one plugin's problem doesn't stop the rest of the loop from
            # running.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$plugin: tag $tag already exists."
            else
              rc=$?
              if [[ $rc -ne 2 ]]; then
                echo "$plugin: git ls-remote failed checking for tag $tag (exit $rc), skipping." >&2
                failed=1
                continue
              fi

              if [[ "$EVENT_NAME" == "push" ]]; then
                echo "$plugin: $old_version -> $new_version, tagging $tag"
              else
                echo "$plugin: tagging $new_version as $tag"
              fi

              if ! git tag "$tag" "$AFTER"; then
                echo "$plugin: git tag failed, skipping." >&2
                failed=1
                continue
              fi
              if ! git push origin "refs/tags/$tag"; then
                echo "$plugin: git push of tag $tag failed, skipping release." >&2
                failed=1
                continue
              fi
            fi

            # Create the release separately from the tag check above, so a
            # tag left over from a prior run whose "gh release create" step
            # failed still gets its release created on this run instead of
            # being skipped forever.
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$plugin: release $tag already exists, skipping."
              continue
            fi

            # Scope the notes' tag range to this plugin's own tag history.
            # Tags interleave across plugins (elite-dev-v0.5.0,
            # elite-ts-v0.2.2, elite-dev-v0.6.0, ...), so GitHub's default
            # "previous tag" pick for --generate-notes would otherwise grab
            # whichever plugin tagged most recently, not this plugin's own
            # last release. --sort=-v:refname is version-aware (v0.10.0
            # sorts after v0.9.0). Note: this bounds the tag range, not
            # which plugin a PR belongs to — a PR that only touched the
            # other plugin and merged in that range can still appear in
            # these notes (see README).
            prev_tag=$(git tag --list "${plugin}-v*" --sort=-v:refname | grep -F -v -x "$tag" | head -n1 || true)

            # --notes-start-tag requires an existing tag name (it maps to the
            # Release Notes API's previous_tag_name param); a commit SHA is
            # not a valid value there. No prior tag for this plugin, so omit
            # the flag and accept --generate-notes' default range for this
            # one release.
            args=(--title "$plugin v$new_version" --generate-notes)
            if [[ -n "$prev_tag" ]]; then
              args+=(--notes-start-tag "$prev_tag")
            fi

            if ! gh release create "$tag" "${args[@]}"; then
              echo "$plugin: gh release create failed for $tag." >&2
              failed=1
              continue
            fi
          done

          exit "$failed"
